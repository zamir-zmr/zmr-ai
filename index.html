<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat Assistant</title>
<meta name="theme-color" content="#0E1116" id="meta-theme">
<script>try{var __s=JSON.parse(localStorage.getItem('zamirSettings')||'{}');document.documentElement.setAttribute('data-theme',__s.theme||'dark');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0E1116;
    --surface:#161A22;
    --surface-2:#1D2230;
    --sidebar:#12151C;
    --border:#262C3B;
    --text:#E9EAEE;
    --text-dim:#8992A6;
    --accent:#FF8A3D;
    --accent-dim:#4A3623;
    --user-bubble:#232A3B;
    --error:#3A1D22;
    --error-text:#FF9C9C;
    --radius:16px;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    height:var(--app-height, 100dvh);
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    width:100%;
  }

  body{
    display:flex;
    position:relative;
    will-change:transform;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:260px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    height:100vh;
    height:var(--app-height, 100dvh);
    position:fixed;
    top:0; left:0;
    z-index:40;
    transform:translateX(-100%);
    transition:transform 220ms cubic-bezier(0.2,0.8,0.2,1);
  }

  #sidebar.open{
    transform:translateX(0);
  }

  @media (min-width:900px){
    #sidebar{ position:static; transform:none; }
    #sidebar-backdrop{ display:none !important; }
  }

  #sidebar-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:35;
    display:none;
  }

  #sidebar-backdrop.show{ display:block; }

  .sidebar-top{
    padding:14px;
    border-bottom:1px solid var(--border);
  }

  #new-chat-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 14px;
    border-radius:22px;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:background 140ms ease, border-color 140ms ease;
  }

  #new-chat-btn:hover{
    background:var(--surface);
    border-color:var(--accent);
  }

  #new-chat-btn svg{ width:16px; height:16px; flex-shrink:0; }

  .sidebar-label{
    font-family:'Manrope',sans-serif;
    font-size:11.5px;
    font-weight:700;
    color:var(--text-dim);
    padding:14px 16px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .sync-badge{
    display:flex;
    align-items:center;
    gap:4px;
    font-weight:600;
    font-size:10.5px;
    color:#57D68D;
  }

  .sync-badge svg{ width:10px; height:10px; }

  #history-list{
    flex:1;
    overflow-y:auto;
    padding:0 8px 8px;
  }

  #history-list::-webkit-scrollbar{ width:5px; }
  #history-list::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }

  .history-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:2px;
    transition:background 120ms ease, color 120ms ease;
    position:relative;
  }

  .history-item:hover{
    background:var(--surface-2);
    color:var(--text);
  }

  .history-item.active{
    background:var(--accent-dim);
    color:var(--accent);
  }

  .history-title{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .history-delete{
    background:transparent;
    border:none;
    color:inherit;
    opacity:0;
    cursor:pointer;
    padding:2px;
    display:flex;
    flex-shrink:0;
    transition:opacity 120ms ease;
  }

  .history-item:hover .history-delete{ opacity:0.7; }
  .history-delete:hover{ opacity:1 !important; }
  .history-delete svg{ width:14px; height:14px; }

  .empty-history{
    color:var(--text-dim);
    font-size:12.5px;
    padding:10px;
    text-align:center;
  }

  /* ---------- Main column ---------- */
  #main-col{
    flex:1;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:var(--app-height, 100dvh);
    min-width:0;
  }

  header{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
    position:sticky;
    top:0;
    z-index:20;
  }

  #menu-btn{
    background:transparent;
    border:none;
    color:var(--text-dim);
    width:34px;
    height:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  #menu-btn:hover{ background:rgba(255,255,255,0.06); color:var(--text); }
  #menu-btn svg{ width:20px; height:20px; }

  @media (min-width:900px){
    #menu-btn{ display:none; }
  }

  .brand-mark{
    width:34px;
    height:34px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--accent), #FFB870);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:14px;
    color:#1A0E00;
    flex-shrink:0;
  }

  .brand-info{ display:flex; flex-direction:column; line-height:1.25; }
  .brand-title{ font-family:'Manrope',sans-serif; font-weight:700; font-size:15px; color:var(--text); }
  .brand-status{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); }

  .status-dot{
    width:6px; height:6px; border-radius:50%;
    background:#57D68D;
    box-shadow:0 0 0 0 rgba(87,214,141,0.5);
    animation:pulse-dot 2.4s ease-out infinite;
  }

  .status-dot.offline{ background:#FF6E6E; }

  @keyframes pulse-dot{
    0%{box-shadow:0 0 0 0 rgba(87,214,141,0.45);}
    70%{box-shadow:0 0 0 6px rgba(87,214,141,0);}
    100%{box-shadow:0 0 0 0 rgba(87,214,141,0);}
  }

  #sound-toggle{
    background:transparent;
    border:none;
    color:var(--text-dim);
    width:34px;
    height:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  #sound-toggle:hover{ background:rgba(255,255,255,0.06); color:var(--text); }
  #sound-toggle svg{ width:19px; height:19px; }

  /* ---------- Model selector (header dropdown) ---------- */
  #model-select-btn{
    margin-left:auto;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:7px 8px;
    border-radius:20px;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
    flex-shrink:0;
  }
  #model-select-btn:hover{ border-color:var(--accent); }

  /* ---------- Voice selector (header dropdown) ---------- */
  #voice-select-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:7px 10px 7px 12px;
    border-radius:20px;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
    max-width:132px;
    flex-shrink:1;
    min-width:0;
    transition:border-color 140ms ease, background 140ms ease;
  }

  #voice-select-btn:hover{ border-color:var(--accent); }
  #voice-select-btn svg.mic-ic{ width:14px; height:14px; color:var(--accent); flex-shrink:0; }
  #voice-select-btn svg.chevron-ic{ width:13px; height:13px; flex-shrink:0; color:var(--text-dim); }

  #voice-select-label{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    min-width:0;
  }

  #voice-fallback-note{
    display:none;
    align-items:center;
    gap:4px;
    font-size:11px;
    line-height:1;
    color:#b45309;
    background:#fffbeb;
    border:1px solid #fde68a;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  #voice-fallback-note.show{ display:inline-flex; }

  .voice-section-label{
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--text-dim);
    padding:10px 4px 4px;
  }

  #voice-sheet-backdrop{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.5);
    z-index:60;
  }
  #voice-sheet-backdrop.show{ display:block; }

  #voice-sheet{
    display:none;
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:61;
    background:var(--surface);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:16px 16px 0 0;
    padding:16px 8px 8px;
    max-width:480px;
    margin:0 auto;
    max-height:78vh;
    box-shadow:0 -8px 30px rgba(0,0,0,0.4);
  }
  #voice-sheet.show{ display:flex; flex-direction:column; animation:sheet-up 180ms ease-out; }

  .voice-sheet-title{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:0 10px 12px;
    flex-shrink:0;
  }

  #voice-option-list{
    overflow-y:auto;
    padding:0 8px;
  }

  .voice-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:13px 12px;
    border-radius:12px;
    cursor:pointer;
    text-align:left;
    margin-bottom:2px;
  }

  .voice-option:hover{ background:var(--surface-2); }

  .voice-option.selected{
    background:var(--accent-dim);
    color:var(--accent);
  }

  .voice-option .radio-dot{
    width:20px; height:20px;
    border-radius:50%;
    border:2px solid var(--text-dim);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .voice-option.selected .radio-dot{ border-color:var(--accent); }
  .voice-option.selected .radio-dot::after{
    content:'';
    width:10px; height:10px;
    border-radius:50%;
    background:var(--accent);
  }

  /* ---------- Chat area ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:24px 10px 12px;
    max-width:900px;
    width:100%;
    margin:0 auto;
    scroll-behavior:smooth;
  }

  main::-webkit-scrollbar{ width:6px; }
  main::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }

  .row{
    display:flex;
    gap:10px;
    margin-bottom:6px;
    max-width:100%;
    animation:rise-in 260ms cubic-bezier(0.2,0.8,0.2,1) both;
  }

  @keyframes rise-in{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .row.user{ flex-direction:row-reverse; }

  .msg-wrap{
    display:flex;
    flex-direction:column;
    max-width:94%;
    width:100%;
  }

  .row.user .msg-wrap{ align-items:flex-end; max-width:88%; width:auto; }

  .avatar{
    width:30px; height:30px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px; font-weight:500; letter-spacing:0.02em;
  }

  .avatar.ai{ background:var(--accent-dim); color:var(--accent); border:1px solid rgba(255,138,61,0.25); }
  .avatar.user{ background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border); }

  .bubble{
    padding:12px 15px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  .row.ai .bubble{
    background:var(--surface);
    border:1px solid var(--border);
    border-top-left-radius:4px;
    color:var(--text);
  }

  .row.user .bubble{
    background:var(--user-bubble);
    border-top-right-radius:4px;
    color:var(--text);
  }

  .bubble.error{
    background:var(--error);
    border:1px solid rgba(255,110,110,0.25);
    color:var(--error-text);
  }

  .bubble img.attach-preview{
    display:block;
    max-width:100%;
    border-radius:10px;
    margin-bottom:8px;
  }

  .msg-actions{
    display:flex;
    gap:6px;
    margin-top:4px;
    opacity:0;
    transition:opacity 140ms ease;
  }

  .row:hover .msg-actions{ opacity:1; }

  .msg-actions button{
    background:transparent;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
    font-size:11.5px;
    padding:3px 6px;
    border-radius:6px;
  }

  .msg-text strong{ font-weight:700; }
  .msg-text em{ font-style:italic; }
  .msg-text code{
    background:rgba(255,255,255,0.08);
    padding:1px 5px;
    border-radius:4px;
    font-family:'SFMono-Regular',Consolas,monospace;
    font-size:0.9em;
  }
  .msg-text pre{
    background:rgba(0,0,0,0.35);
    padding:10px 12px;
    border-radius:8px;
    overflow-x:auto;
    margin:6px 0;
  }
  .msg-text pre code{ background:none; padding:0; }

  .ai-meta{
    display:flex;
    align-items:center;
    gap:4px;
    margin-top:6px;
    width:100%;
  }

  .ai-meta .ai-actions{ margin-top:0; width:auto; gap:2px; }
  .ai-meta .msg-time{
    font-size:11px;
    color:var(--text-dim);
    margin-left:auto;
    white-space:nowrap;
  }

  .model-name{
    display:block;
    font-family:'Manrope',sans-serif;
    font-size:11px;
    font-weight:700;
    color:var(--accent);
    margin:0 0 4px 2px;
  }

  .ai-actions .regen-btn.spinning svg{ animation:spin 0.8s linear infinite; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .msg-actions button:hover{ background:var(--surface-2); color:var(--text); }
  .msg-actions svg{ width:13px; height:13px; }

  .ai-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    margin-top:6px;
  }

  .ai-actions button{
    background:transparent;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border-radius:8px;
    flex-shrink:0;
  }

  .ai-actions button:hover{ background:var(--surface-2); color:var(--text); }
  .ai-actions svg{ width:15px; height:15px; }

  .ai-actions .copy-btn.done{ color:#57D68D; }
  .ai-actions .speak-btn.speaking{ color:var(--accent); background:var(--accent-dim); }

  .typing{
    display:inline-flex; align-items:center; gap:4px; padding:4px 2px;
  }

  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-dim);
    animation:bounce 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }

  @keyframes bounce{
    0%, 60%, 100%{transform:translateY(0); opacity:0.5;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  /* ---------- Footer / input ---------- */
  footer{
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    flex-shrink:0;
    position:sticky;
    bottom:0;
    z-index:20;
  }

  #attach-preview-bar{
    max-width:760px;
    margin:0 auto 8px;
    display:none;
    padding:0 2px;
  }

  #attach-preview-bar.active{ display:flex; }

  .preview-chip{
    position:relative;
    width:64px; height:64px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--border);
    flex-shrink:0;
  }

  .preview-chip img{ width:100%; height:100%; object-fit:cover; display:block; }

  .preview-chip .remove-btn{
    position:absolute; top:2px; right:2px;
    width:18px; height:18px;
    border-radius:50%;
    background:rgba(0,0,0,0.65);
    color:#fff; border:none;
    font-size:12px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
  }

  #edit-banner{
    max-width:760px;
    margin:0 auto 8px;
    display:none;
    align-items:center;
    justify-content:space-between;
    background:var(--accent-dim);
    border:1px solid rgba(255,138,61,0.3);
    color:var(--accent);
    font-size:12.5px;
    padding:7px 12px;
    border-radius:10px;
  }

  #edit-banner.active{ display:flex; }
  #edit-banner button{
    background:transparent; border:none; color:var(--accent);
    cursor:pointer; font-size:12px; font-weight:600;
  }

  form{
    max-width:760px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:5px 5px 5px 6px;
    transition:border-color 160ms ease, box-shadow 160ms ease;
  }

  form:focus-within{
    border-color:rgba(255,138,61,0.5);
    box-shadow:0 0 0 3px rgba(255,138,61,0.12);
  }

  .icon-btn{
    background:transparent; border:none; color:var(--text-dim);
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    transition:background 140ms ease, color 140ms ease;
  }

  .icon-btn:hover{ background:rgba(255,255,255,0.06); color:var(--text); }
  .icon-btn svg{ width:20px; height:20px; }

  #mic-btn.recording{
    color:#ff4d4d;
    background:rgba(255,77,77,0.12);
    animation:mic-pulse 1.1s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,77,77,0.35); }
    50%{ box-shadow:0 0 0 8px rgba(255,77,77,0); }
  }

  #live-btn.live-active{
    color:var(--accent);
    background:var(--accent-dim);
    animation:live-pulse 1.3s ease-in-out infinite;
  }
  @keyframes live-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,138,61,0.35); }
    50%{ box-shadow:0 0 0 8px rgba(255,138,61,0); }
  }

  #attach-menu-backdrop{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.5);
    z-index:50;
  }
  #attach-menu-backdrop.show{ display:block; }

  #attach-menu{
    display:none;
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:51;
    background:var(--surface);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:16px 16px 0 0;
    padding:8px;
    max-width:480px;
    margin:0 auto;
    box-shadow:0 -8px 30px rgba(0,0,0,0.4);
  }
  #attach-menu.show{ display:block; animation:sheet-up 180ms ease-out; }
  @keyframes sheet-up{ from{ transform:translateY(16px); opacity:0.6; } to{ transform:translateY(0); opacity:1; } }

  .attach-menu-item{
    width:100%;
    display:flex; align-items:center; gap:12px;
    background:transparent; border:none;
    color:var(--text);
    font-family:'Inter',sans-serif; font-size:15px;
    padding:14px 12px;
    border-radius:10px;
    cursor:pointer;
  }
  .attach-menu-item:hover{ background:var(--surface-2); }
  .attach-menu-item svg{ width:22px; height:22px; color:var(--accent); flex-shrink:0; }

  #attach-menu-cancel{
    width:100%;
    margin-top:6px;
    background:var(--surface-2);
    border:none;
    color:var(--text-dim);
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;

  /* ===== v2: light theme, animations, pin/rename, settings, share, tokens ===== */
  html[data-theme="light"]{color-scheme:light;--bg:#F4F6FA;--surface:#FFFFFF;--surface-2:#EDF0F6;--sidebar:#FFFFFF;--border:#DDE2EC;--text:#1B2030;--text-dim:#667085;--accent:#F2711C;--accent-dim:#FFE8D6;--user-bubble:#E4EAF6;--error:#FDE8E8;--error-text:#B42318}

  .bubble{font-size:var(--fs,14.5px)}

  @keyframes fade-in{from{opacity:0}to{opacity:1}}

  @keyframes msg-in-right{from{opacity:0;transform:translate(16px,10px) scale(.96)}to{opacity:1;transform:none}}

  @keyframes item-in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}

  @keyframes ripple{to{transform:scale(1);opacity:0}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,0)}50%{box-shadow:0 0 18px 2px rgba(255,138,61,.35)}}
  @keyframes toast-in{from{opacity:0;transform:translate(-50%,16px) scale(.95)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

  header{animation:drop-in 520ms cubic-bezier(.2,.8,.2,1) both}

  .bubble{transition:box-shadow 200ms ease}
  .row.ai:hover .bubble{box-shadow:0 4px 18px rgba(0,0,0,.12)}
  .history-item{animation:item-in 380ms cubic-bezier(.2,.8,.2,1) both;transition:background 120ms ease,color 120ms ease,transform 180ms ease}
  .history-item:nth-child(2){animation-delay:30ms}.history-item:nth-child(3){animation-delay:60ms}.history-item:nth-child(4){animation-delay:90ms}.history-item:nth-child(5){animation-delay:120ms}.history-item:nth-child(6){animation-delay:150ms}.history-item:nth-child(7){animation-delay:180ms}.history-item:nth-child(8){animation-delay:210ms}
  .history-item:hover{transform:translateX(3px)}
  #new-chat-btn{transition:background 140ms ease,border-color 140ms ease,transform 180ms ease}
  #new-chat-btn:hover{transform:translateY(-1px)}
  #new-chat-btn svg{transition:transform 300ms cubic-bezier(.3,1.4,.5,1)}
  #new-chat-btn:hover svg{transform:rotate(90deg)}
  button[type="submit"]:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,138,61,.35)}
  .icon-btn:hover{transform:scale(1.08)}
  .ai-actions button{transition:background 140ms ease,color 140ms ease,transform 160ms ease}
  .ai-actions button:hover{transform:translateY(-1px) scale(1.08)}

  #attach-menu-backdrop.show,#voice-sheet-backdrop.show,#sidebar-backdrop.show{animation:fade-in 220ms ease both}
  #attach-menu.show,#voice-sheet.show{animation:sheet-spring 360ms cubic-bezier(.2,.9,.25,1.05) both}

  .rip{position:relative;overflow:hidden}
  .ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}

  /* sidebar top: theme button */
  .sidebar-top{display:flex;gap:8px;align-items:center}
  #new-chat-btn{flex:1;width:auto}
  #theme-btn{border:1px solid var(--border);background:var(--surface-2);width:40px;height:40px}
  #theme-btn svg{transition:transform 500ms cubic-bezier(.3,1.4,.5,1)}
  #theme-btn:hover svg{transform:rotate(40deg)}
  #settings-btn svg{transition:transform 400ms ease}
  #settings-btn:hover svg{transform:rotate(60deg)}
  @media (max-width:420px){header{padding:12px 10px;gap:6px}}

  /* pin + rename */
  .hist-group{font-family:'Manrope',sans-serif;font-weight:700;font-size:10.5px;color:var(--text-dim);padding:8px 10px 4px}
  .pin-mark{width:12px;height:12px;color:var(--accent);flex-shrink:0;animation:pop 400ms both}
  .history-act{background:transparent;border:none;color:inherit;opacity:0;cursor:pointer;padding:2px;display:flex;flex-shrink:0;transition:opacity 120ms ease,transform 160ms ease}
  .history-act svg{width:14px;height:14px}

  .history-act:hover{opacity:1 !important;transform:scale(1.15)}
  .history-act.on{color:var(--accent);opacity:1}
  @media (hover:none){.history-act,.history-delete{opacity:.55}}
  .history-item input.rename-input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:3px 6px;font-size:13px;color:var(--text);outline:none;box-shadow:0 0 0 3px rgba(255,138,61,.15)}

  /* scroll to bottom */
  footer{position:sticky}
  #scroll-bottom-btn{position:absolute;top:-56px;right:18px;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translateY(12px) scale(.7);pointer-events:none;transition:opacity 240ms ease,transform 320ms cubic-bezier(.3,1.4,.5,1),border-color 140ms ease}
  #scroll-bottom-btn.show{opacity:1;transform:none;pointer-events:auto}
  #scroll-bottom-btn:hover{border-color:var(--accent);color:var(--accent)}
  #scroll-bottom-btn svg{width:20px;height:20px}


  /* sheets (settings + share) */
  .sheet-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:69;backdrop-filter:blur(3px)}
  .sheet-backdrop.show{display:block;animation:fade-in 220ms ease both}
  .sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:20px 20px 0 0;padding:8px;max-width:480px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.4);max-height:88vh;overflow-y:auto}
  .sheet.show{display:block;animation:sheet-spring 380ms cubic-bezier(.2,.9,.25,1.05) both}
  .sheet-title{display:flex;align-items:center;justify-content:space-between;font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;padding:8px 10px 10px}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 10px;border-top:1px solid var(--border);animation:fade-in 400ms both}
  .set-label{font-size:14px;color:var(--text)}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
  .seg button{background:transparent;border:none;color:var(--text-dim);font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:9px;cursor:pointer;transition:background 220ms ease,color 220ms ease}
  .seg button.active{background:var(--accent);color:#1A0E00}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0}
  .switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
  .switch span{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:background 250ms ease}
  .switch span::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform 320ms cubic-bezier(.3,1.4,.5,1)}
  .switch input:checked+span{background:var(--accent)}
  .switch input:checked+span::after{transform:translateX(20px)}
  .set-select,.set-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 10px;font-family:'Manrope',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color 140ms ease}
  .set-select:hover,.set-btn:hover{border-color:var(--accent)}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:9px 16px;border-radius:20px;font-size:13px;z-index:90;opacity:0;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  #toast.show{opacity:1;animation:toast-in 300ms cubic-bezier(.2,.9,.25,1.1) both}

  /* ===== v3 ===== */
  #model-select-btn,#voice-select-btn{display:none !important}
  #sound-toggle{margin-left:auto}
  #main-col{position:relative;z-index:1}
  body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;will-change:transform}
  body::before{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:radial-gradient(circle,rgba(255,138,61,.20),transparent 65%);animation:drift-a 24s ease-in-out infinite alternate}
  body::after{width:56vmax;height:56vmax;right:-22vmax;bottom:-20vmax;background:radial-gradient(circle,rgba(91,124,255,.18),transparent 65%);animation:drift-b 28s ease-in-out infinite alternate}
  html[data-theme="light"] body::before{background:radial-gradient(circle,rgba(242,113,28,.14),transparent 65%)}
  html[data-theme="light"] body::after{background:radial-gradient(circle,rgba(91,124,255,.12),transparent 65%)}
  @keyframes drift-a{to{transform:translate(10vmax,8vmax) scale(1.15)}}
  @keyframes drift-b{to{transform:translate(-9vmax,-7vmax) scale(1.12)}}

  /* splash */
  #splash{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s ease,visibility .6s}
  #splash.hide{opacity:0;visibility:hidden}
  .splash-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--accent),#FFB870);display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:26px;color:#1A0E00;animation:splash-pop 900ms cubic-bezier(.2,.9,.25,1.2) both,glow 2.4s 900ms ease-in-out infinite}
  .splash-name{font-family:'Manrope',sans-serif;font-weight:700;font-size:20px;color:var(--text);animation:fade-up .8s .25s both}
  .splash-bar{width:120px;height:3px;border-radius:3px;background:var(--surface-2);overflow:hidden;animation:fade-up .8s .4s both}
  .splash-bar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:3px;animation:splash-slide 1s ease-in-out infinite}
  @keyframes splash-pop{from{opacity:0;transform:scale(.5) rotate(-14deg)}to{opacity:1;transform:none}}
  @keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes splash-slide{from{transform:translateX(-110%)}to{transform:translateX(280%)}}

  /* hero (empty chat) */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:11vh;padding:0 16px;animation:fade-in 600ms both}
  .hero-orb{position:relative;width:96px;height:96px;margin-bottom:22px;animation:float 5s ease-in-out infinite}
  .hero-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),#5B7CFF,#57D68D,var(--accent));animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);filter:drop-shadow(0 0 14px rgba(255,138,61,.45))}
  .hero-core{position:absolute;inset:14px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#FFB870);display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:24px;color:#1A0E00;animation:pop 700ms 150ms cubic-bezier(.3,1.4,.5,1) both}
  .hero-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:26px;background:linear-gradient(90deg,var(--text),var(--accent),var(--text));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite,fade-up 700ms 200ms both}
  .hero-sub{margin-top:8px;font-size:14.5px;color:var(--text-dim);animation:fade-up 700ms 350ms both}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes shimmer{from{background-position:0 0}to{background-position:-200% 0}}

  /* streaming cursor + typing */
  .bubble.streaming .msg-text::after{content:'';display:inline-block;width:7px;height:15px;margin-left:3px;vertical-align:-2px;border-radius:2px;background:var(--accent);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  /* speaker button */
  .speak-btn .ic-stop{display:none}

  .speak-btn.speaking .ic-play{display:none}

  @keyframes speak-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,.45)}50%{box-shadow:0 0 0 7px rgba(255,138,61,0)}}

  /* history active bar */
  .history-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;border-radius:3px;background:var(--accent);animation:bar-grow .35s cubic-bezier(.3,1.4,.5,1) both}

  /* settings stagger + inputs */
  .sheet.show .set-row{animation:item-in .42s cubic-bezier(.2,.8,.2,1) both}
  .sheet.show .set-row:nth-of-type(2){animation-delay:40ms}.sheet.show .set-row:nth-of-type(3){animation-delay:80ms}.sheet.show .set-row:nth-of-type(4){animation-delay:120ms}.sheet.show .set-row:nth-of-type(5){animation-delay:160ms}.sheet.show .set-row:nth-of-type(6){animation-delay:200ms}.sheet.show .set-row:nth-of-type(7){animation-delay:240ms}.sheet.show .set-row:nth-of-type(8){animation-delay:280ms}.sheet.show .set-row:nth-of-type(9){animation-delay:320ms}
  .set-hint{font-size:11.5px;color:var(--text-dim);margin-top:3px;max-width:230px;line-height:1.35}

  .set-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,138,61,.15)}


  /* ===== v5: wallpaper, bday, reply, long-press, swipe ===== */
  main{position:relative;z-index:1}
  .row{position:relative;touch-action:pan-y}
  @media (hover:none){.row .bubble{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
  .row.pressed .bubble{box-shadow:0 0 0 2px var(--accent),0 8px 24px rgba(0,0,0,.25);transition:box-shadow .2s}
  #wallpaper{position:absolute;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat;animation:fade-in .6s both}
  #wallpaper::after{content:'';position:absolute;inset:0;background:rgba(14,17,22,.58)}

  .set-col{flex-direction:column;align-items:flex-start}

  .wp-sw:hover{transform:translateY(-2px)}
  .wp-sw.active{border-color:var(--accent);transform:scale(1.1);box-shadow:0 0 0 3px rgba(255,138,61,.2)}
  .wp-sw.wp-none,.wp-sw.wp-add{background:var(--surface-2)}

  /* birthday banner + confetti */
  #bday-banner{display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(120deg,var(--accent-dim),rgba(91,124,255,.18));border:1px solid rgba(255,138,61,.35);position:relative;z-index:3;width:calc(100% - 24px);max-width:876px;margin:10px auto 0;flex-shrink:0}
  #bday-banner.show{display:flex;animation:drop-in 520ms cubic-bezier(.2,.9,.25,1.1) both}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}

  @keyframes confetti-fall{to{transform:translate(var(--dx,0),108vh) rotate(720deg);opacity:.7}}

  /* reply banner + quote */
  #reply-banner{max-width:760px;margin:0 auto 8px;display:none;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);padding:7px 10px;border-radius:10px;font-size:12.5px}
  #reply-banner.active{display:flex;animation:rise-up 260ms cubic-bezier(.2,.9,.25,1) both}
  #reply-banner .rb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  #reply-banner b{font-family:'Manrope',sans-serif;color:var(--accent);font-size:11.5px}
  #reply-banner span{color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #reply-banner button{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:15px}
  .reply-quote{border-left:3px solid var(--accent);background:rgba(255,138,61,.1);border-radius:6px;padding:5px 8px;margin-bottom:7px;font-size:12.5px;color:var(--text-dim);white-space:normal;display:flex;flex-direction:column}
  .reply-quote b{font-family:'Manrope',sans-serif;color:var(--accent);font-size:11px}
  .star-mark{position:absolute;top:-8px;right:-4px;color:#FFC15A;font-size:15px;animation:pop .4s both;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .bubble{position:relative}

  /* swipe hint */
  .swipe-hint{position:absolute;top:50%;width:34px;height:34px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
  .swipe-hint.del{background:rgba(255,110,110,.18);color:#FF6E6E}

     We track the real visual viewport height in JS and re-run
     scrollToBottom() whenever it changes. */
  function setAppHeight() {
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
    // On Android Chrome, focusing the input can auto-scroll the outer
    // layout viewport even though body's own height already matches the
    // visible visual viewport. That scroll pushes the header off the top
    // and leaves a gap below the footer. Counter-translating body by the
    // visual viewport's offsetTop keeps header pinned to the very top and
    // footer pinned right above the on-screen keyboard.
    if (vv) {

    }
  }

  if (window.visualViewport) {

  /* ---------------- Text-to-speech engine ----------------
     Tries the selected Gemini-quality voice first (via our backend TTS
     proxy at /api/groq-tts, same "hide the key on the server" pattern as
     /api/gemini). If that voice is unavailable — network error, server
     error, or quota/rate-limit exhausted — it falls back to the
     browser's built-in speechSynthesis automatically and silently. */
  let currentTtsAudio = null;
  let ttsGen = 0, ttsAbort = null, currentUtterance = null;
  function fadeOutAudio(a) {
    let v = a.volume; const dec = Math.max(v / 6, 0.05);
    const iv = setInterval(() => {
      v -= dec;
      if (v <= 0.02) { clearInterval(iv); try { a.pause(); } catch (_) {} }
      else { try { a.volume = v; } catch (_) {} }
    }, 18);
  }

  // Mobile Chrome blocks audio.play() unless it was triggered directly by
  // a user tap. Our AI voice auto-plays after the reply streams in (not
  // from a click), so without this it silently fails and falls back to
  // the device voice every single time. Unlocking playback once on the
  // very first tap anywhere in the app fixes that for the rest of the
  // session.
  let audioUnlocked = false;
  function unlockAudioPlayback() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
      const unlock = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
      unlock.play().catch(() => {});
    } catch (_) {}
  }
  document.addEventListener('click', unlockAudioPlayback, { once: true, capture: true });
  document.addEventListener('touchstart', unlockAudioPlayback, { once: true, capture: true });

  function speakText(text, { onStart, onEnd } = {}) {
    cancelSpeaking();
    const gen = ttsGen;

    const plain = stripMarkdownForSpeech(text);
    if (!plain) { if (onEnd) onEnd(); return; }

    const voice = getVoiceById(activeVoiceId);

    // If the user explicitly picked a device voice, always use it.
    if (voice.browser) {
      speakFallback(plain, onEnd, onStart, voice.lang || 'hi-IN', voice.voiceURI);
      return;
    }

    const apiUrl = voice.elevenlabs ? '/api/elevenlabs'
      : voice.deepgram ? '/api/deepgram-tts'
      : '/api/groq-tts';
    const providerName = voice.elevenlabs ? 'ElevenLabs'
      : voice.deepgram ? 'Deepgram'
      : 'Groq';
    const voiceParam = voice.elevenlabs || voice.deepgram || voice.gemini;

    if (onStart) onStart();
    ttsAbort = new AbortController();
    fetch(apiUrl, {
      signal: ttsAbort.signal,
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: plain, voice: voiceParam })
    }).then(async (res) => {
      if (!res.ok) {
        let reason = 'HTTP ' + res.status;
        if (res.status === 429 || res.status === 503) {
          markQuotaExhausted();
        } else {
          try {
            const errBody = await res.json();
            const msg = (errBody?.error?.message || '').toLowerCase();
            reason = errBody?.error?.message || reason;
            if (msg.includes('quota') || msg.includes('resource_exhausted') || msg.includes('rate limit')) {
              markQuotaExhausted();
            }
          } catch (_) {
            // A non-JSON body (plain "404 Not Found" HTML, etc.) usually
            // means the backend function isn't deployed on the server at all.
            reason += ' (non-JSON response — check that ' + apiUrl.replace('/api/', 'api/') + '.js is deployed)';
          }
        }
        // Dev-only diagnostic: never shown to the user, but visible in
        // the browser console/devtools so the real cause (missing
        // endpoint, missing API key, bad voice name, etc.) can be
        // found instead of silently always falling back.
        console.warn('[voice] ' + providerName + ' TTS unavailable:', reason);
        showVoiceFallbackNote(reason);
        throw new Error('tts-unavailable');
      }
      const data = await res.json();
      if (gen !== ttsGen) return;
      if (!data || !data.audioContent) throw new Error('tts-empty');

      const audio = new Audio('data:' + (data.mimeType || 'audio/mpeg') + ';base64,' + data.audioContent);
      audio.playbackRate = 1.05; // slightly slower, more natural pace
      audio.preservesPitch = true;
      currentTtsAudio = audio;
      audio.onended = () => { currentTtsAudio = null; if (onEnd) onEnd(); };
      // A single playback/decode glitch should NOT permanently switch the
      // whole session to the fallback voice — just use the fallback for
      // this one line and keep trying the chosen Gemini voice next time.
      audio.onerror = (e) => {
        console.warn('[voice] Audio playback/decode error:', e);
        if (gen !== ttsGen) return;
        currentTtsAudio = null;
        speakFallback(plain, onEnd);
      };
      audio.play().catch((e) => {
        console.warn('[voice] audio.play() rejected:', e);
        if (gen !== ttsGen) return;
        currentTtsAudio = null;
        speakFallback(plain, onEnd);
      });
    }).catch((err) => {
      if (gen !== ttsGen) return;
      if (err && err.message !== 'tts-unavailable' && err.message !== 'tts-empty') {
        console.warn('[voice] TTS request failed:', err);
        showVoiceFallbackNote(err.message || 'Network error');
      }
      speakFallback(plain, onEnd);
    });
  }

  function showVoiceFallbackNote(reason) {
    if (!voiceFallbackNote) return;
    voiceFallbackNote.textContent = '⚠ ' + reason;
    voiceFallbackNote.title = reason;

    clearTimeout(showVoiceFallbackNote._t);

  // Internal safety net only — NOT shown as a selectable voice option.
  // If the Groq voice genuinely fails (bad key, model/account issue,
  // network error), this keeps the app from going completely silent by
  // using the device's built-in speech engine for that one reply.
  function speakFallback(plain, onEnd, onStart, lang, voiceURI) {
    if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
    const synth = window.speechSynthesis;
    synth.cancel();
    const g = ttsGen;
    if (onStart) onStart();
    setTimeout(() => {
      if (g !== ttsGen) return;
      const utterance = new SpeechSynthesisUtterance(plain);
      if (lang) {
        utterance.lang = lang;
        const hindiVoice = voiceURI
          ? browserVoicesCache.find(v => v.voiceURI === voiceURI)
          : browserVoicesCache.find(v => v.lang && v.lang.toLowerCase().startsWith('hi'));
        if (hindiVoice) utterance.voice = hindiVoice;
      }
      utterance.rate = 1.15;
      currentUtterance = utterance;
      utterance.onend = () => { if (onEnd) onEnd(); };
      utterance.onerror = () => { if (onEnd) onEnd(); };
      synth.speak(utterance);
    }, 50);
  }

  function cancelSpeaking() {
    ttsGen++;
    if (ttsAbort) { try { ttsAbort.abort(); } catch (_) {} ttsAbort = null; }
    if (currentUtterance) { currentUtterance.onend = null; currentUtterance.onerror = null; currentUtterance = null; }
    try { window.speechSynthesis.cancel(); } catch (_) {}
    if (currentTtsAudio) {
      const a = currentTtsAudio; currentTtsAudio = null;
      a.onended = null; a.onerror = null;
      fadeOutAudio(a);
    }
  }

  function deleteSession(id, evt) {
    evt.stopPropagation();

    if (currentSessionId === id) {
      const remaining = sessions.filter(s => s.id !== id);

  function renderHistoryList() {
    if (sessions.length === 0) {
      historyList.innerHTML = '<div class="empty-history">Koi chat history nahi hai</div>';
      return;
    }
    const pinSvg = (fill) => '<svg viewBox="0 0 24 24" fill="' + (fill ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"></path><path d="M9 3h6l-1 7 3 3H7l3-3z"></path></svg>';
    const ordered = sessions.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    const anyPinned = ordered.some(s => s.pinned);
    let html = '', last = null;
    ordered.forEach(s => {
      const isPin = !!s.pinned;
      if (anyPinned && last !== isPin) html += '<div class="hist-group">' + (isPin ? 'Pinned' : 'Recent') + '</div>';
      last = isPin;
      html += `
      <div class="history-item ${s.id === currentSessionId ? 'active' : ''}" data-id="${s.id}">
        ${isPin ? '<span class="pin-mark">' + pinSvg(true) + '</span>' : ''}
        <span class="history-title">${escapeHtml(s.title || 'New chat')}</span>
        <button class="history-act history-pin ${isPin ? 'on' : ''}" data-id="${s.id}" title="${isPin ? 'Unpin' : 'Pin'}">${pinSvg(isPin)}</button>
        <button class="history-act history-rename" data-id="${s.id}" title="Rename">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"></path></svg>
        </button>
        <button class="history-delete" data-id="${s.id}" title="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
        </button>
      </div>`;
    });
    historyList.innerHTML = html;

    historyList.querySelectorAll('.history-item').forEach(item => {
      item.addEventListener('click', () => loadSession(item.dataset.id));
    });
    historyList.querySelectorAll('.history-delete').forEach(btn => {
      btn.addEventListener('click', (e) => deleteSession(btn.dataset.id, e));
    });
    historyList.querySelectorAll('.history-pin').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const s = sessions.find(x => x.id === btn.dataset.id);
        if (s) sessionsRef.child(s.id).update({ pinned: !s.pinned });
      });
    });
    historyList.querySelectorAll('.history-rename').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        startRename(btn.closest('.history-item'), btn.dataset.id);
      });
    });
  }

  function startRename(item, id) {
    const s = sessions.find(x => x.id === id);
    const span = item && item.querySelector('.history-title');
    if (!s || !span) return;
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'rename-input'; inp.maxLength = 60; inp.value = s.title || '';
    span.replaceWith(inp);
    inp.focus(); inp.select();
    let done = false;
    const commit = (save) => {
      if (done) return; done = true;
      const v = inp.value.trim();
      if (save && v && v !== s.title) sessionsRef.child(id).update({ title: v });
      else renderHistoryList();
    };
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') commit(true);
      else if (e.key === 'Escape') commit(false);
    });
    inp.addEventListener('blur', () => commit(true));
  }

  /* ---------------- Sound effects (Web Audio API, no external files) ---------------- */
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, duration, type = 'sine', volume = 0.08) {
    if (!soundOn) return;
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (_) {}
  }

  function playSendSound() { playTone(720, 0.09, 'sine', 0.07); }
  function playReceiveSound() {
    playTone(520, 0.08, 'sine', 0.06);
    setTimeout(() => playTone(660, 0.1, 'sine', 0.06), 70);
  }

    attachMenuBackdrop.classList.remove('show');
  }

  attachBtn.addEventListener('click', openAttachMenu);
  attachMenuBackdrop.addEventListener('click', closeAttachMenu);
  attachMenuCancel.addEventListener('click', closeAttachMenu);

  attachCameraOption.addEventListener('click', () => {
    closeAttachMenu();
    fileInputCamera.click();
  });

  attachGalleryOption.addEventListener('click', () => {
    closeAttachMenu();
    fileInput.click();
  });

  async function handleSelectedFiles(fileList) {
    const files = Array.from(fileList || []);
    for (const file of files) {
      try {
        const { base64, mimeType } = await compressImageToTarget(file);
        const previewUrl = `data:${mimeType};base64,${base64}`;
        pendingAttachments.push({ mimeType, base64, previewUrl });
      } catch (err) {
        console.error('Image compress failed, falling back to raw file:', err);
        const base64 = await fileToBase64(file);
        const previewUrl = `data:${file.type};base64,${base64}`;
        pendingAttachments.push({ mimeType: file.type, base64, previewUrl });
      }
    }
    renderPreviewBar();
    keepFocus();
  }

  fileInput.addEventListener('change', async () => {
    await handleSelectedFiles(fileInput.files);
    fileInput.value = '';
  });

  fileInputCamera.addEventListener('change', async () => {
    await handleSelectedFiles(fileInputCamera.files);
    fileInputCamera.value = '';
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- Client-side image compression ----------------
     Vercel serverless functions reject overly large request bodies
     (413 Payload Too Large). Instead of sending the raw photo, we
     draw it onto a canvas and re-encode it as JPEG, shrinking both
     the dimensions and the quality step-by-step until the resulting
     base64 payload lands around ~50-60 KB. */
  const TARGET_MAX_BYTES = 60 * 1024;   // 60 KB upper bound (best-effort ~50-60KB)

  function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  function canvasToBase64(canvas, quality) {
    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    return dataUrl.split(',')[1];
  }

  function base64SizeBytes(base64) {
    // Approx decoded byte size of a base64 string.
    return Math.ceil((base64.length * 3) / 4);
  }

  async function compressImageToTarget(file) {
    if (!file.type.startsWith('image/')) {
      const base64 = await fileToBase64(file);
      return { base64, mimeType: file.type };
    }

    const img = await loadImageFromFile(file);

    let width = img.naturalWidth || img.width;
    let height = img.naturalHeight || img.height;

    // Start by capping the longest side to keep the canvas reasonable.
    const MAX_DIMENSION = 1280;
    if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
      const scale = MAX_DIMENSION / Math.max(width, height);
      width = Math.round(width * scale);
      height = Math.round(height * scale);
    }

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    let quality = 0.8;
    let base64 = '';

    // Iteratively lower quality first, then shrink dimensions, until
    // the encoded size fits inside our target window (or we hit floors).
    for (let attempt = 0; attempt < 12; attempt++) {
      canvas.width = width;
      canvas.height = height;
      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);

      base64 = canvasToBase64(canvas, quality);
      const size = base64SizeBytes(base64);

      if (size <= TARGET_MAX_BYTES) break;

      if (quality > 0.35) {
        quality -= 0.1;
      } else {
        width = Math.round(width * 0.85);
        height = Math.round(height * 0.85);
        if (width < 160 || height < 160) break; // don't go below a usable minimum
      }
    }

    return { base64, mimeType: 'image/jpeg' };
  }

  function renderPreviewBar() {
    if (pendingAttachments.length === 0) {
      previewBar.classList.remove('active');
      previewBar.innerHTML = '';
      return;
    }
    previewBar.classList.add('active');
    previewBar.innerHTML = pendingAttachments.map((att, i) => `
      <div class="preview-chip" style="margin-right:8px;">
        <img src="${att.previewUrl}" alt="attachment">
        <button type="button" class="remove-btn" data-index="${i}">✕</button>
      </div>
    `).join('');

    previewBar.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.index, 10);
        pendingAttachments.splice(idx, 1);
        renderPreviewBar();
        keepFocus();
      });
    });
  }

  /* ---------------- Edit message ---------------- */
  function startEdit(index) {
    const session = getCurrentSession();
    const msg = session.messages[index];
    if (!msg || msg.role !== 'user') return;

    editingIndex = index;
    userInput.value = msg.text || '';
    pendingAttachments = (msg.attachments || []).map(a => ({ ...a }));
    renderPreviewBar();
    showEditBanner();
    keepFocus();
  }

  function showEditBanner() { editBanner.classList.add('active'); }
  function hideEditBanner() { editBanner.classList.remove('active'); editingIndex = null; }

  cancelEditBtn.addEventListener('click', () => {
    hideEditBanner();
    userInput.value = '';
    pendingAttachments = [];
    renderPreviewBar();
    keepFocus();
  });

  /* ---------------- Send flow ---------------- */
  /* ---------------- Voice input (Speech-to-Text) ----------------
     continuous:true + an auto-restart-on-timeout in onend keeps the mic
     visibly "on" the whole time — Android Chrome's engine still silently
     ends a session after a short pause even in continuous mode, but we
     immediately start a fresh one behind the scenes (without touching
     the 'recording' class) so it never flickers off and on. It only
     actually stops — and then auto-sends — when the user taps the mic
     button again themselves. */
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let isRecording = false;

  function createMicRecognizer() {
    const rec = new SpeechRecognitionAPI();
    rec.continuous = false;
    rec.interimResults = true;
    rec.lang = 'hi-IN'; // Hindi/Hinglish friendly; falls back gracefully for English speech too.

    rec.onresult = (event) => {
      let transcript = '';
      for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      userInput.value = transcript;
    };

    rec.onerror = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
    };

    rec.onend = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
      keepFocus();
      // Auto-send as soon as the user stops dictation — they shouldn't
      // have to tap Send after speaking.
      const spokenText = userInput.value.trim();
      if (spokenText) {
        if (chatForm.requestSubmit) chatForm.requestSubmit();
        else chatForm.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    };

    return rec;
  }

  if (SpeechRecognitionAPI) {
    micBtn.addEventListener('click', () => {
      if (isRecording) {
        try { recognizer.stop(); } catch (_) {}
        return;
      }
      isRecording = true;
      micBtn.classList.add('recording');
      try {
        recognizer = createMicRecognizer();
        recognizer.start();
      } catch (err) {
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    });
  } else {
    micBtn.addEventListener('click', () => {
      alert('Aapka browser voice input (Speech-to-Text) support nahi karta.');
    });
  }

  /* ---------------- Live voice conversation mode ----------------
     Note: this uses the browser's own Speech-to-Text (SpeechRecognition)
     and Text-to-Speech (speechSynthesis) together with our existing
     text chat pipeline. It is a continuous listen -> auto-send ->
     auto-speak-reply loop, not a raw audio-to-audio stream — a Vercel
     serverless function proxying REST calls cannot hold a native
     bidirectional audio socket the way Gemini's own Live app does. */
  let liveModeActive = false;
  let liveRecognizer = null;
  let isLiveSpeaking = false;
  let livePendingTranscript = '';
  const LIVE_STOP_WORDS = ['ruko ruko', 'ruk jao', 'ruko', 'stop stop', 'stop', 'bas ruko', 'chup ho jao', 'wait wait'];
  const LIVE_GREETING = 'Hi! Boliye, main sun raha hoo.';

  function containsStopWord(text) {
    const t = (text || '').toLowerCase();
    return LIVE_STOP_WORDS.some(w => t.includes(w));
  }

  function createLiveRecognizer() {
    const rec = new SpeechRecognitionAPI();
    // Fix for repeated/duplicated words: continuous=true on Android Chrome
    // sometimes re-emits earlier "final" segments again inside the same
    // session, and manually concatenating (+=) those chunks compounded the
    // duplication ("1 se lekar1 se lekar1 se lekar..."). Using one
    // utterance per session avoids that engine quirk entirely — the
    // session ends naturally when the user pauses, and we immediately
    // start a fresh session for the next utterance (see rec.onend below).
    rec.continuous = false;
    rec.interimResults = true;
    rec.lang = 'hi-IN';

    rec.onresult = (event) => {
      // Feedback-loop fix: while the AI is speaking, the recognizer is
      // fully stopped (see speakInLiveMode / rec.onend below), so this
      // should never fire during playback. This guard is just a safety
      // net in case a stray event lands right as we're stopping the mic —
      // it must NEVER be treated as user speech, otherwise the AI's own
      // voice gets picked up and re-sent as if the user said it.
      if (isLiveSpeaking) return;

      // Recompute the full transcript fresh from all results every time,
      // instead of appending (+=) to a running buffer — this is what
      // makes the fix self-correcting even if the engine re-sends a
      // result: we always end up with the current best transcript, not
      // an ever-growing, duplicated one.
      let transcript = '';
      for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      livePendingTranscript = transcript.trim();
      userInput.value = livePendingTranscript;
    };

    rec.onerror = () => {};

    rec.onend = () => {
      if (!liveModeActive || isLiveSpeaking) return;

      const finished = livePendingTranscript.trim();
      livePendingTranscript = '';

      if (finished && !containsStopWord(finished)) {
        userInput.value = finished;
        if (chatForm.requestSubmit) chatForm.requestSubmit();
        else chatForm.dispatchEvent(new Event('submit', { cancelable: true }));
        return; // mic stays off; startLiveListening() resumes it once the AI finishes speaking
      }

      startLiveListening();
    };

    return rec;
  }

  function startLiveListening() {
    if (!liveModeActive || isLiveSpeaking) return;
    if (liveRecognizer) {
      try { liveRecognizer.onend = null; liveRecognizer.stop(); } catch (_) {}
    }
    try {
      liveRecognizer = createLiveRecognizer();
      liveRecognizer.start();
    } catch (err) {
      console.error('Live listen error:', err);
    }
  }

  function stopLiveListeningForSpeech() {
    // Fully stop (not just ignore) the recognizer before the AI speaks,
    // so the microphone hardware itself is off — this is what actually
    // prevents the AI's TTS audio from being captured and looped back
    // in as a fake user message.
    if (liveRecognizer) {
      try { liveRecognizer.onend = null; liveRecognizer.stop(); } catch (_) {}
      liveRecognizer = null;
    }
    livePendingTranscript = '';
  }

  function startLiveMode() {
    if (!SpeechRecognitionAPI) {
      alert('Aapka browser live voice conversation support nahi karta.');
      return;
    }
    liveModeActive = true;
    liveBtn.classList.add('live-active');
    livePendingTranscript = '';

    // Instant greeting the moment the button is tapped — no waiting on a
    // round trip to the AI, matching Gemini Live's immediate "hi".
    const session = getCurrentSession();
    if (session) {
      const greetMsg = { role: 'ai', text: LIVE_GREETING, attachments: [], createdAt: Date.now() };
      if (!session.messages) session.messages = [];
      session.messages.push(greetMsg);
      saveSession(session);
      appendMessageDOM(greetMsg, session.messages.length - 1);
    }
    speakInLiveMode(LIVE_GREETING);
  }

  function stopLiveMode() {
    liveModeActive = false;
    liveBtn.classList.remove('live-active');
    isLiveSpeaking = false;
    stopLiveListeningForSpeech();
    cancelSpeaking();
  }

  liveBtn.addEventListener('click', () => {
    if (liveModeActive) stopLiveMode();
    else startLiveMode();
  });

  function speakInLiveMode(text) {
    if (!liveModeActive || !text) return;
    isLiveSpeaking = true;
    stopLiveListeningForSpeech(); // mic OFF while the AI talks — stops the feedback loop
    speakText(text, {
      onEnd: () => {
        isLiveSpeaking = false;
        if (liveModeActive) startLiveListening(); // mic back ON only after the AI finishes speaking
      }
    });
  }

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (isSending) return;

    const promptText = userInput.value.trim();
    if (!promptText && pendingAttachments.length === 0) return;

    const session = getCurrentSession();
    if (!session) return;

    isSending = true;

    const attachmentsForThisMessage = pendingAttachments;
    pendingAttachments = [];
    renderPreviewBar();
    userInput.value = '';
    clearDraft();
    sendBtn.disabled = true;
    sendLabel.textContent = '...';
    keepFocus();

    if (editingIndex !== null) {
      session.messages = session.messages.slice(0, editingIndex);
      renderCurrentSession();
      hideEditBanner();
    }

    if (!session.messages) session.messages = [];
    const userMsg = { role: 'user', text: promptText, attachments: attachmentsForThisMessage, createdAt: Date.now() };
    if (replyTo) { userMsg.replyTo = { role: replyTo.role, text: replyTo.text }; clearReply(); }
    session.messages.push(userMsg);
    updateSessionTitle(session);
    saveSession(session);

    appendMessageDOM(userMsg, session.messages.length - 1);
    playSendSound();

    const apiHistory = buildApiHistory(session);

    const cacheKey = (attachmentsForThisMessage.length === 0 && !userMsg.replyTo) ? (session.id + '|' + promptText.toLowerCase()) : null;
    if (cacheKey && responseCache.has(cacheKey)) {
      const cached = responseCache.get(cacheKey);
      const aiMsg = { role: 'ai', text: cached, attachments: [], createdAt: Date.now(), model: selectedModel };
      session.messages.push(aiMsg);
      saveSession(session);
      const cachedRow = appendMessageDOM(aiMsg, session.messages.length - 1);
      playReceiveSound();
      if (liveModeActive) speakInLiveMode(cached);
      // Normal chat: awaaz sirf speaker button dabane par aayegi (auto-speak band).
      finishSend();
      return;
    }

    const loadingId = appendTypingIndicator();
    let aiRow = null;
    let fullText = '';

    try {
      let historyToSend = apiHistory;
      try {
        await streamGemini(historyToSend, (chunk) => {
          fullText += chunk;
          if (!aiRow) {
            removeMessage(loadingId);
            aiRow = appendMessageDOM({ role: 'ai', text: '', attachments: [], createdAt: Date.now(), model: selectedModel }, session.messages.length);
          }
          updateMessageBubble(aiRow, fullText);
        });
      } catch (firstError) {
        // Self-healing: if we still hit 413 even after the history cap
        // and single-image trimming above (e.g. a huge legacy image sitting
        // in an old chat), retry ONE more time using only the current
        // message with no prior context, instead of forcing the user to
        // manually start a new chat.
        if (firstError.status === 413 && historyToSend.length > 1) {
          historyToSend = historyToSend.slice(-1);
          fullText = '';
          await streamGemini(historyToSend, (chunk) => {
            fullText += chunk;
            if (!aiRow) {
              removeMessage(loadingId);
              aiRow = appendMessageDOM({ role: 'ai', text: '', attachments: [], createdAt: Date.now(), model: selectedModel }, session.messages.length);
            }
            updateMessageBubble(aiRow, fullText);
          });
        } else {
          throw firstError;
        }
      }

      if (!aiRow) {
        removeMessage(loadingId);
        fullText = fullText || 'No response generated.';
        aiRow = appendMessageDOM({ role: 'ai', text: fullText, attachments: [], createdAt: Date.now(), model: selectedModel }, session.messages.length);
      }

      const aiMsg = { role: 'ai', text: fullText, attachments: [], createdAt: Date.now(), model: selectedModel };
      session.messages.push(aiMsg);
      saveSession(session);
      if (cacheKey) responseCache.set(cacheKey, fullText);
      playReceiveSound();
      if (liveModeActive) speakInLiveMode(fullText);
      // Normal chat: awaaz sirf speaker button dabane par aayegi (auto-speak band).

    } catch (error) {
      console.error(error);
      removeMessage(loadingId);
      const errMsg = 'Maaf kijiye, error aa gaya hai: ' + error.message;
      if (aiRow) {
        updateMessageBubble(aiRow, errMsg, true);
      } else {
        appendMessageDOM({ role: 'ai', text: errMsg, attachments: [], createdAt: Date.now(), model: selectedModel }, session.messages.length);
      }
      session.messages.push({ role: 'ai', text: errMsg, attachments: [], createdAt: Date.now(), model: selectedModel });
      saveSession(session);
      if (liveModeActive) startLiveListening();
    } finally {
      finishSend();
    }
  });

  function buildApiHistory(session) {
    const allMessages = session.messages || [];

    // Permanent guard against 413 Payload Too Large: never resend more
    // than the last MAX_HISTORY_MESSAGES turns as context, no matter how
    // long the saved chat history grows. Full history stays saved in
    // Firebase for the user to scroll back through; only what we SEND to
    // Gemini is capped.
    const MAX_HISTORY_MESSAGES = 20;
    const messages = allMessages.slice(-MAX_HISTORY_MESSAGES);

    // Fix for 413 Payload Too Large: earlier versions resent EVERY image
    // ever attached in this chat on every single request, so the payload
    // kept growing with the conversation (and could blow past the size
    // limit even when the new message was plain text like "Hi").
    // Now we only include the actual image data for the most recent
    // message that has attachments; older image turns are replaced with
    // a short text placeholder so the model still knows an image was
    // shared there, without resending the bytes.
    let lastAttachmentIndex = -1;
    messages.forEach((m, i) => {
      if ((m.attachments || []).length) lastAttachmentIndex = i;
    });

    return messages.map((m, i) => {
      const parts = [];
      if (m.text || m.replyTo) parts.push({ text: (m.replyTo ? '[Replying to ' + (m.replyTo.role === 'user' ? 'my' : 'your') + ' earlier message: "' + m.replyTo.text + '"]\n' : '') + (m.text || '') });

      const hasAttachments = (m.attachments || []).length > 0;
      if (hasAttachments && i === lastAttachmentIndex) {
        m.attachments.forEach(att => {
          parts.push({ inline_data: { mime_type: att.mimeType, data: att.base64 } });
        });
      } else if (hasAttachments) {
        parts.push({ text: '[an image was shared here earlier in the chat]' });
      }

      if (parts.length === 0) parts.push({ text: '' });

      return { role: m.role === 'user' ? 'user' : 'model', parts };
    });
  }

  function finishSend() {
    document.querySelectorAll('.bubble.streaming').forEach(b => b.classList.remove('streaming'));
    isSending = false;
    sendBtn.disabled = false;
    sendLabel.textContent = 'Send';
    keepFocus();
  }

  function keepFocus() {
    requestAnimationFrame(() => userInput.focus());
  }

  async function regenerateResponse(indexStr, regenBtn) {
    if (isSending) return;
    const index = parseInt(indexStr, 10);
    const session = getCurrentSession();
    if (!session || !session.messages || !session.messages[index]) return;

    const row = chatContainer.querySelector(`.row[data-index="${index}"]`);
    if (!row) return;

    const originalMsg = session.messages[index];
    const historyForRegen = buildApiHistory({ messages: session.messages.slice(0, index) });

    isSending = true;
    regenBtn.classList.add('spinning');
    regenBtn.disabled = true;
    updateMessageBubble(row, '');

    let fullText = '';
    try {
      await streamGemini(historyForRegen, (chunk) => {
        fullText += chunk;
        updateMessageBubble(row, fullText);
      });
      fullText = fullText || 'No response generated.';

      session.messages[index] = { role: 'ai', text: fullText, attachments: [], createdAt: Date.now(), model: selectedModel };
      saveSession(session);

      const timeEl = row.querySelector('.msg-time');
      if (timeEl) timeEl.textContent = formatRelativeTime(Date.now());

      // Regenerate karte waqt agar dropdown me alag Gemini chuna gaya hai,
      // to naam-badge aur avatar bhi usi naye model ke hisaab se update karo.
      const regenLabel = getModelLabel(selectedModel);
      const nameEl = row.querySelector('.model-name');
      if (nameEl) nameEl.textContent = regenLabel;
      const avatarEl = row.querySelector('.avatar');
      if (avatarEl) {
        avatarEl.textContent = regenLabel.replace('Ai ', 'Ai');
        avatarEl.title = regenLabel;
      }
      // Regenerate par bhi auto-speak band — speaker button dabane par hi awaaz.

    } catch (error) {
      console.error(error);
      updateMessageBubble(row, (originalMsg.text || '') + '\n\n[Regenerate failed: ' + error.message + ']', true);
      setTimeout(() => updateMessageBubble(row, originalMsg.text || ''), 2500);
    } finally {
      document.querySelectorAll('.bubble.streaming').forEach(b => b.classList.remove('streaming'));
      isSending = false;
      regenBtn.classList.remove('spinning');
      regenBtn.disabled = false;
    }
  }

  /* ---------------- Streaming API call ---------------- */
  function getClientTimeInfo() {
    const now = new Date();
    const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const localString = new Intl.DateTimeFormat('en-IN', {
      dateStyle: 'full',
      timeStyle: 'long',
      timeZone
    }).format(now);
    return { localString, timeZone, isoString: now.toISOString() };
  }

  async function streamGemini(apiHistory, onChunk, retriesLeft = 2, isRetry = false) {
    let response;
    try {
      response = await fetch(getStreamUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: apiHistory, clientTime: getClientTimeInfo() })
      });
    } catch (networkErr) {
      if (retriesLeft > 0) {
        await new Promise(res => setTimeout(res, 300));
        return streamGemini(apiHistory, onChunk, retriesLeft - 1, true);
      }
      throw networkErr;
    }

    if (!response.ok) {
      let errMsg = `API Error: ${response.status}`;
      try {
        const errData = await response.json();
        errMsg = errData.error?.message || errMsg;
      } catch (_) {}
      if (response.status === 413) {
        errMsg = 'Yeh chat bahut lambi ho gayi hai ya isme koi bahut badi file hai. Kripya "New Chat" shuru karein.';
      }
      if ((response.status === 503 || response.status === 429) && retriesLeft > 0) {
        await new Promise(res => setTimeout(res, 300));
        return streamGemini(apiHistory, onChunk, retriesLeft - 1, true);
      }
      const err = new Error(errMsg);
      err.status = response.status;
      throw err;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const jsonStr = trimmed.slice(5).trim();
        if (!jsonStr || jsonStr === '[DONE]') continue;
        try {
          const parsed = JSON.parse(jsonStr);
          const piece = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
          if (piece) onChunk(piece);
        } catch (_) {}
      }
    }
  }

  /* ---------------- DOM rendering ---------------- */
  function appendMessageDOM(msg, index) {
    if (index >= 0) { const hr = chatContainer.querySelector('.hero'); if (hr) hr.remove(); }
    const isUser = msg.role === 'user';
    const row = document.createElement('div');
    row.className = `row ${isUser ? 'user' : 'ai'}`;
    row.dataset.index = index;

    const imagesHtml = (msg.attachments || []).map(a => `<img class="attach-preview" src="${a.previewUrl}" alt="attachment">`).join('');

    const editBtnHtml = (isUser && index >= 0) ? `

  function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  function renderMarkdown(text) {
    let escaped = escapeHtml(text || '');

    // Fenced code blocks ```code```
    escaped = escaped.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);

    // Inline code `code`
    escaped = escaped.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    // Bold **text** or __text__
    escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    escaped = escaped.replace(/__([^_]+)__/g, '<strong>$1</strong>');

    // Italic *text* or _text_
    escaped = escaped.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    escaped = escaped.replace(/(^|[^a-zA-Z0-9])_([^_]+)_(?![a-zA-Z0-9])/g, '$1<em>$2</em>');

    return escaped;
  }

  /* ---------------- Speech-safe text ----------------
     The text-to-speech engine should only ever speak the actual words —
     never markdown symbols like *, _, `, or #. This strips all markdown
     syntax (keeping the wrapped content) before anything is handed to
     SpeechSynthesisUtterance, for both the per-message speaker button
     and live voice conversation mode. */
  function stripMarkdownForSpeech(text) {
    let plain = text || '';

    plain = plain.replace(/```([\s\S]*?)```/g, (_, code) => code.trim());   // fenced code blocks -> content only
    plain = plain.replace(/`([^`\n]+)`/g, '$1');                            // inline code
    plain = plain.replace(/\*\*([^*]+)\*\*/g, '$1');                        // bold **text**
    plain = plain.replace(/__([^_]+)__/g, '$1');                            // bold __text__
    plain = plain.replace(/\*([^*]+)\*/g, '$1');                            // italic *text*
    plain = plain.replace(/(^|[^a-zA-Z0-9])_([^_]+)_(?![a-zA-Z0-9])/g, '$1$2'); // italic _text_
    plain = plain.replace(/^\s{0,3}#{1,6}\s+/gm, '');                       // markdown headers
    plain = plain.replace(/^\s*[-*+]\s+/gm, '');                            // bullet markers
    plain = plain.replace(/[*_~`#]/g, '');                                  // any leftover stray symbols

    return plain.trim();
  }

  function formatRelativeTime(ts) {
    if (!ts) return '';
    const diffSec = Math.floor((Date.now() - ts) / 1000);
    if (diffSec < 10) return 'Just now';
    if (diffSec < 60) return diffSec + 's ago';
    const diffMin = Math.floor(diffSec / 60);
    if (diffMin < 60) return diffMin + (diffMin === 1 ? ' minute ago' : ' minutes ago');
    const diffHr = Math.floor(diffMin / 60);
    if (diffHr < 24) return diffHr + (diffHr === 1 ? ' hour ago' : ' hours ago');
    const diffDay = Math.floor(diffHr / 24);
    if (diffDay < 30) return diffDay + (diffDay === 1 ? ' day ago' : ' days ago');
    return new Date(ts).toLocaleDateString();
  }
