      else if (!m.starred && old) old.remove();
    }
    toast(m.starred ? 'Star lagaya ★' : 'Star hataya');
  });

  /* 75 + 76 — Touch gestures: swipe right = reply, swipe left = delete, long-press = menu */
  const ICON_REPLY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>';
  const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>';
  const SWIPE_TRIGGER = 80;
  let gs = null, lpTimer = null;
  function msgRowOf(t) {
    const r = t && t.closest ? t.closest('.row') : null; if (!r) return null;
    return parseInt(r.dataset.index, 10) >= 0 ? r : null;
  }
  function resetGesture(animate) {
    clearTimeout(lpTimer);
    if (gs && gs.row) {
      const row = gs.row, hint = gs.hint;
      if (animate) {
        row.style.transition = 'translate .28s cubic-bezier(.2,.9,.25,1.1)'; row.style.translate = '0 0';
        setTimeout(() => { row.style.transition = ''; row.style.translate = ''; }, 300);
      } else { row.style.translate = ''; }
      if (hint) hint.remove();
    }
    gs = null;
  }
  chatContainer.addEventListener('touchstart', (e) => {
    resetGesture(false);
    if (e.touches.length !== 1) return;
    const row = msgRowOf(e.target); if (!row) return;
    if (e.target.closest('button,a,input,textarea,pre')) return;
    const t = e.touches[0];
    gs = { row, x: t.clientX, y: t.clientY, mode: null, fired: false, hint: null, dx: 0 };
    lpTimer = setTimeout(() => { if (gs && !gs.mode) { gs.fired = true; openMsgMenu(row); } }, 480);
  }, { passive: true });
  chatContainer.addEventListener('touchmove', (e) => {
    if (!gs || gs.fired) return;
    const t = e.touches[0]; const dx = t.clientX - gs.x, dy = t.clientY - gs.y;
    if (!gs.mode && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
      clearTimeout(lpTimer);
      gs.mode = (Math.abs(dx) > Math.abs(dy) * 1.4) ? 'swipe' : 'scroll';
      if (gs.mode === 'swipe') {
        const h = document.createElement('div');
        h.className = 'swipe-hint' + (dx < 0 ? ' del' : '');
        h.innerHTML = dx < 0 ? ICON_TRASH : ICON_REPLY;
        h.style[dx < 0 ? 'right' : 'left'] = '8px';
        gs.row.appendChild(h); gs.hint = h;
      }
    }
    if (gs.mode === 'swipe') {
      if (e.cancelable) e.preventDefault();
      const x = Math.max(-100, Math.min(100, dx * 0.7)); gs.dx = dx;
      gs.row.style.translate = x + 'px 0';
      if (gs.hint) {
        const p = Math.max(0, Math.min(1, (Math.abs(x) - 26) / 30));
        gs.hint.style.translate = (-x) + 'px -50%';
        gs.hint.style.opacity = p;
        gs.hint.style.scale = 0.6 + 0.5 * p;
      }
    }
  }, { passive: false });
  function endGesture() {
    clearTimeout(lpTimer);
    if (!gs) return;
    if (gs.mode === 'swipe') {
      const row = gs.row, dx = gs.dx, idx = parseInt(row.dataset.index, 10);
      resetGesture(true);
      const sess = getCurrentSession(); const m = sess && sess.messages && sess.messages[idx];
      if (m && dx > SWIPE_TRIGGER) setReply(m);
      else if (m && dx < -SWIPE_TRIGGER) setTimeout(() => deleteMessage(idx), 180);
      return;
    }
    gs = null;
  }
  chatContainer.addEventListener('touchend', endGesture);
  chatContainer.addEventListener('touchcancel', () => resetGesture(true));
  chatContainer.addEventListener('contextmenu', (e) => {
    const r = msgRowOf(e.target); if (!r) return;
    e.preventDefault(); if (!gs || !gs.fired) openMsgMenu(r);
  });

  /* 62 — Family birthday reminder */
  const FAMILY_BDAYS = [
    { name: 'Zamir', rel: 'Husband', m: 3, d: 17 },
    { name: 'Rahima', rel: 'Wife', m: 1, d: 1 },
    { name: 'Zaina Praveen', rel: 'Beti', m: 5, d: 24 }
  ];
  function daysToBday(m, d) {
    const n = new Date(); const t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    let x = new Date(n.getFullYear(), m - 1, d); if (x < t) x = new Date(n.getFullYear() + 1, m - 1, d);
    return Math.round((x - t) / 86400000);
  }
  function launchConfetti() {
    const box = document.getElementById('confetti'); const cols = ['#FF8A3D', '#FFC15A', '#57D68D', '#5B7CFF', '#FF6EA8', '#B58CFF'];
    for (let i = 0; i < 46; i++) {
      const c = document.createElement('i'); c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%'; c.style.background = cols[i % cols.length];
      c.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
      c.style.animationDuration = (3 + Math.random() * 2.5) + 's'; c.style.animationDelay = (Math.random() * 1.2) + 's';
      box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 7500);
  }
  function initBirthdayBanner() {
    let best = null;
    FAMILY_BDAYS.forEach(b => { const dd = daysToBday(b.m, b.d); if (dd <= 7 && (!best || dd < best.dd)) best = Object.assign({ dd }, b); });
    if (!best) return;
    const today = new Date().toLocaleDateString('en-CA');
    const dkey = today + '|' + best.name;
    try { if (localStorage.getItem('zamirBdayDismiss') === dkey) return; } catch (_) {}
    const banner = document.getElementById('bday-banner');
    document.getElementById('bday-emoji').textContent = best.dd === 0 ? '🎂' : '🎈';
    document.getElementById('bday-text').textContent = best.dd === 0
      ? 'Aaj ' + best.name + ' (' + best.rel + ') ka birthday hai! 🎉'
      : best.name + ' (' + best.rel + ') ka birthday ' + (best.dd === 1 ? 'kal hai' : best.dd + ' din mein hai');
    document.getElementById('bday-go').textContent = best.dd === 0 ? 'Wish likho' : 'Wish taiyar karo';
    setTimeout(() => banner.classList.add('show'), 1400);
    if (best.dd === 0) {
      let seen = null; try { seen = localStorage.getItem('zamirConfetti'); } catch (_) {}
      if (seen !== dkey) { try { localStorage.setItem('zamirConfetti', dkey); } catch (_) {} setTimeout(launchConfetti, 1500); }
    }
    document.getElementById('bday-x').addEventListener('click', () => {
      banner.classList.remove('show'); try { localStorage.setItem('zamirBdayDismiss', dkey); } catch (_) {}
    });
    document.getElementById('bday-go').addEventListener('click', () => {
      if (isSending) return;
      banner.classList.remove('show'); try { localStorage.setItem('zamirBdayDismiss', dkey); } catch (_) {}
      userInput.value = best.name + ' (' + best.rel + ') ke birthday ke liye ek pyaari Hinglish birthday wish aur choti si shayari likho.';
      if (chatForm.requestSubmit) chatForm.requestSubmit(); else chatForm.dispatchEvent(new Event('submit', { cancelable: true }));
    });
  }

  applyWallpaper();
  initBirthdayBanner();
</script>
